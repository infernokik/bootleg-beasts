[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootleg-beasts"
version = "0.1.0"
description = "Math model, exact calculation and Monte Carlo verification for a 5x5 ways slot"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "numba>=0.60", "matplotlib>=3.8", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bootleg_beasts = ["model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
